name: 收盘选股

on:
  schedule:
    # A股收盘后约10分钟：新加坡时间 15:10（UTC 07:10），周一至周五
    - cron: '10 7 * * 1-5'
  # 支持在 GitHub Actions 页面手动测试
  workflow_dispatch:

# 避免手动运行与定时运行同时操作同一个数据库缓存
concurrency:
  group: stock-selection
  cancel-in-progress: false

jobs:
  run-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 数据库持久化策略：
      # 1. 每次运行生成唯一 cache key，避免同一个 key 无法覆盖
      # 2. 用固定前缀恢复最近一次成功保存的数据库
      # 3. 首次没有数据库时才执行全量 init；之后 main.py run 会执行增量更新
      - name: Restore database cache
        id: db-cache
        uses: actions/cache@v4
        with:
          path: data
          key: stock-db-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stock-db-${{ runner.os }}-${{ github.ref_name }}-
            stock-db-${{ runner.os }}-

      - name: Check database state
        id: check-db
        shell: bash
        run: |
          if [ -s "data/stock_selection.db" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ 已恢复数据库缓存"
            ls -lh data/stock_selection.db
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 未找到数据库，将执行首次全量初始化"
          fi

      - name: Initialize data (first run only)
        if: steps.check-db.outputs.exists == 'false'
        run: python main.py init
        timeout-minutes: 45

      # main.py run 已经包含：收盘时间检查、当天数据检查和必要时的增量更新
      - name: Run selection and push
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python main.py run
        timeout-minutes: 30

      - name: Verify database after run
        if: ${{ success() }}
        shell: bash
        run: |
          if [ ! -s "data/stock_selection.db" ]; then
            echo "❌ 运行完成后数据库不存在，缓存不会被视为有效状态"
            exit 1
          fi
          echo "✅ 数据库已准备好用于下一次运行"
          ls -lh data/stock_selection.db

      # 任何核心步骤失败都自动报警；报警步骤本身失败不会掩盖真正的失败原因
      - name: Notify failure to Feishu
        if: ${{ failure() && env.FEISHU_WEBHOOK != '' }}
        continue-on-error: true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE="❌ 收盘选股 Workflow 执行失败\n\n仓库：${GITHUB_REPOSITORY}\n分支：${GITHUB_REF_NAME}\n运行编号：${GITHUB_RUN_NUMBER}\n时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')\n\n请检查 GitHub Actions：${GITHUB_RUN_URL}"

          python - "$FEISHU_WEBHOOK" "$MESSAGE" <<'PY'
          import requests
          import sys

          webhook = sys.argv[1]
          message = sys.argv[2]

          response = requests.post(
              webhook,
              json={"msg_type": "text", "content": {"text": message}},
              timeout=10,
          )
          response.raise_for_status()
          result = response.json()
          if result.get("code") != 0:
              raise RuntimeError(f"飞书返回错误: {result}")
          print("✅ 失败报警已发送到飞书")
          PY
