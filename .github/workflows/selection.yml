name: 收盘选股

on:
  schedule:
    # A股收盘后约10分钟：新加坡时间 15:10（UTC 07:10），周一至周五
    - cron: '10 7 * * 1-5'
  # 支持在 GitHub Actions 页面手动测试
  workflow_dispatch:

jobs:
  run-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-

      - name: Check database
        id: check-db
        run: |
          if [ -f "data/stock_selection.db" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize data (first run)
        if: steps.check-db.outputs.exists == 'false'
        run: python main.py init
        timeout-minutes: 45

      - name: Run selection and push
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python main.py run
        timeout-minutes: 30

      - name: Notify failure to Feishu
        if: ${{ failure() }}
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "FEISHU_WEBHOOK 未设置，无法发送失败报警"
            exit 1
          fi

          MESSAGE="❌ 收盘选股 Workflow 执行失败\n\n仓库：${GITHUB_REPOSITORY}\n分支：${GITHUB_REF_NAME}\n运行编号：${GITHUB_RUN_NUMBER}\n时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')\n\n请检查 GitHub Actions：${GITHUB_RUN_URL}"

          python - "$FEISHU_WEBHOOK" "$MESSAGE" <<'PY'
          import requests
          import sys

          webhook = sys.argv[1]
          message = sys.argv[2]

          response = requests.post(
              webhook,
              json={"msg_type": "text", "content": {"text": message}},
              timeout=10,
          )
          response.raise_for_status()
          result = response.json()
          if result.get("code") != 0:
              raise RuntimeError(f"飞书返回错误: {result}")
          print("✅ 失败报警已发送到飞书")
          PY
